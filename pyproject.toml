[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keychecker"
version = "1.1.0"
authors = [
    {name = "Cyfinoid Research", email = "keychecker@cyfinoid.com"},
]
description = "A fast CLI to fingerprint SSH private keys and identify which Git hosting accounts they unlock"
readme = "Readme.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers", 
    "Intended Audience :: System Administrators",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
keywords = ["ssh", "key", "fingerprint", "git", "github", "gitlab", "bitbucket", "security", "audit"]
dependencies = [
    "cryptography>=49.0.0",
    "asyncssh>=2.24.0",
    "aiohttp>=3.14.2",
    "tqdm>=4.69.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "black>=26.5.1", 
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "types-tqdm>=4.69.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[project.scripts]
keychecker = "keychecker.cli:main"

[project.urls]
"Homepage" = "https://github.com/cyfinoid/keychecker"
"Bug Reports" = "https://github.com/cyfinoid/keychecker/issues"
"Source" = "https://github.com/cyfinoid/keychecker"
"Documentation" = "https://github.com/cyfinoid/keychecker#readme"

[tool.setuptools.packages.find]
include = ["keychecker*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# uv-specific configurations
[tool.uv]
required-version = ">=0.12.0,<0.13.0"

# PEP 735 dependency groups (replaces the deprecated [tool.uv] dev-dependencies)
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "black>=26.5.1", 
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "types-tqdm>=4.69.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]
