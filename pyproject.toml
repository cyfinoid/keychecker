[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keychecker"
version = "1.1.0"
authors = [
    {name = "Cyfinoid Research", email = "keychecker@cyfinoid.com"},
]
description = "A fast CLI to fingerprint SSH private keys and identify which Git hosting accounts they unlock"
readme = "Readme.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers", 
    "Intended Audience :: System Administrators",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
keywords = ["ssh", "key", "fingerprint", "git", "github", "gitlab", "bitbucket", "security", "audit"]
dependencies = [
    "cryptography>=50.0.1",
    "asyncssh>=2.24.0",
    "aiohttp>=3.14.3",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "mypy>=2.3.0",
    "types-tqdm>=4.70.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[project.scripts]
keychecker = "keychecker.cli:main"

[project.urls]
"Homepage" = "https://github.com/cyfinoid/keychecker"
"Bug Reports" = "https://github.com/cyfinoid/keychecker/issues"
"Source" = "https://github.com/cyfinoid/keychecker"
"Documentation" = "https://github.com/cyfinoid/keychecker#readme"

[tool.setuptools.packages.find]
include = ["keychecker*"]

# Lint tooling switched from flake8+black to ruff.
# Initial switch proposed in cyfinoid/keychecker#5 by @prgyn8 (PragyanTiwari);
# adapted here with a config matching the previous flake8 gate (.flake8, now
# removed) and the repo's 88-char black line length.
[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info", ".venv", "venv"]

[tool.ruff.lint]
# Mirror the previous flake8 gate: pycodestyle (E/W) + pyflakes (F) only.
# Deliberately NOT adopting ruff 0.16's broader defaults (UP/I/BLE/S/RUF/...)
# in this switch; see DETAILED_CHANGELOG 2026-10-06 ruff entry.
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# uv-specific configurations
[tool.uv]
required-version = ">=0.12.0,<0.13.0"

# PEP 735 dependency groups (replaces the deprecated [tool.uv] dev-dependencies)
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "mypy>=2.3.0",
    "types-tqdm>=4.70.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]
