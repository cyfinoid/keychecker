name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Security: No default permissions - each job specifies its own
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to checkout repository contents
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.0"
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: uv sync --all-extras
    
    - name: Run tests
      run: uv run pytest -v
    
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to checkout repository contents
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.0"
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --all-extras
    
    - name: Run linting
      run: |
        uv run flake8 keychecker/ tests/
        uv run black --check keychecker/ tests/
    
    - name: Run type checking
      run: uv run mypy keychecker/

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to checkout repository contents
      security-events: write  # Required for uploading SARIF results
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.0"
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --all-extras
    
    - name: Run Bandit security scan
      uses: PyCQA/bandit-action@67a458d90fa11fb1463e91e7f4c8f068b5863c7f # v1.0.1
      with:
        exclude: "./tests/,./scripts/,./__pycache__,./*.pyc,./.git/"
                  
    - name: Run pip-audit vulnerability scan
      # Run pip-audit through uv so it executes inside the uv project
      # environment (Python >=3.10 + locked deps). The gh-action-pip-audit
      # action instead uses the runner's ambient Python (3.9 here, pulled in by
      # the Bandit action), which cannot resolve/audit deps that require >=3.10.
      # `--local` audits only the packages installed in the uv .venv.
      run: uv run pip-audit --local --desc
      # Note: pip-audit exits non-zero when vulnerabilities are found, failing the job.

  build:
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # Required for uploading artifacts
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.0"
    
    - name: Set up Python
      run: uv python install 3.10  # Use minimum supported version for build
    
    - name: Install build dependencies
      run: uv tool install twine
    
    - name: Build package
      run: uv build
    
    - name: Check package
      run: uv tool run twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ github.sha }}
        path: dist/
        retention-days: 7
